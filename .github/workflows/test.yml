name: Test

on:
  push:
   branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100"
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --lib --bins --examples --tests
      - run: cargo test --workspace --benches
      - run: cargo test --workspace --doc

  check:
    name: Check
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi
      - name: Check without atomics
        run: cargo check -p narrow -p narrow-ffi --target thumbv6m-none-eabi
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doctest
        run: cargo test --workspace --doc
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -Dwarnings
      - name: Rustfmt
        run: cargo fmt --all -- --check

  targets:
    name: Check (${{ matrix.target }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native
          - name: tree borrows
            flags: -Zmiri-tree-borrows
          - name: i686
            target: i686-unknown-linux-gnu
          - name: s390x
            target: s390x-unknown-linux-gnu
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      TARGET_ARGS: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - run: cargo miri setup $TARGET_ARGS
      - run: cargo miri test -p narrow-ffi $TARGET_ARGS

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-targets --codecov --output-path codecov.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: codecov.json
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
